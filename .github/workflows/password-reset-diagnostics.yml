name: Password reset diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /var/www/backend/quantumconnectsio_backend
            node - <<'NODE'
            const e=require('./src/config/env');
            const {sequelize}=require('./src/config/db');
            const {User,CallLog,WorkflowExecution,AutomationEvent}=require('./src/models');
            const canonical='https://quantumconnects.io';
            const describeUrl=v=>{try{const u=new URL(v);return {configured:true,https:u.protocol==='https:',canonical:u.origin===canonical,testWebhook:u.pathname.includes('/webhook-test/'),temporary:/ngrok|localhost|127\.0\.0\.1/.test(u.hostname)}}catch{return {configured:false}}};
            const get=async(url,headers)=>{const r=await fetch(url,{headers,signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json()};
            (async()=>{
             console.log('CONFIG',JSON.stringify({publicApi:describeUrl(e.PUBLIC_API_BASE_URL),retellWebhook:describeUrl(e.RETELL_WEBHOOK_URL),retellKey:!!e.RETELL_API_KEY,twilio:!!(e.TWILIO_ACCOUNT_SID&&e.TWILIO_AUTH_TOKEN),automationKey:!!e.AUTOMATION_SHARED_KEY,stripeKey:!!e.STRIPE_SECRET_KEY,stripeLive:/^(sk|rk)_live_/.test(e.STRIPE_SECRET_KEY),stripeWebhook:!!e.STRIPE_WEBHOOK_SECRET,n8n:Object.fromEntries(Object.keys(e).filter(k=>k.startsWith('N8N_')).map(k=>[k,describeUrl(e[k])]))}));
             const users=await User.findAll({where:{role:'user'},attributes:['id','status','plan','inboundNumber','twilioPhoneNumberSid','retellAgentId','provisioningStatus'],raw:true});
             const provisioned=users.filter(u=>u.inboundNumber&&u.retellAgentId);
             console.log('TENANTS',JSON.stringify({total:users.length,active:users.filter(u=>u.status==='Active').length,paid:users.filter(u=>u.plan!=='Free').length,provisioned:provisioned.length,duplicateInboundNumbers:users.filter(u=>u.inboundNumber).length-new Set(users.filter(u=>u.inboundNumber).map(u=>u.inboundNumber)).size}));
             const {Op}=require('sequelize');const recent={createdAt:{[Op.gte]:new Date(Date.now()-7*86400000)}};
             console.log('ACTIVITY',JSON.stringify({callsLast7Days:await CallLog.count({where:recent}),workflowExecutionsLast7Days:await WorkflowExecution.count({where:recent}),automationFailuresLast7Days:await AutomationEvent.count({where:{...recent,status:'failed'}})}));
             const headers={Authorization:'Bearer '+e.RETELL_API_KEY};
             for(let i=0;i<provisioned.length;i++){
              const u=provisioned[i];const out={tenantIndex:i+1,status:u.status,plan:u.plan,provisioningStatus:u.provisioningStatus};
              try{
               const [phone,agent]=await Promise.all([get('https://api.retellai.com/get-phone-number/'+encodeURIComponent(u.inboundNumber),headers),get('https://api.retellai.com/get-agent/'+encodeURIComponent(u.retellAgentId),headers)]);
               out.inboundWebhookCorrect=phone.inbound_webhook_url===canonical+'/api/automation/retell/inbound';out.hasFallbackAgent=!!phone.inbound_agent_id||!!phone.inbound_agents?.length;out.eventWebhookCorrect=agent.webhook_url===canonical+'/api/automation/retell/events';out.events=agent.webhook_events||[];out.engine=agent.response_engine?.type;
               if(agent.response_engine?.llm_id){const llm=await get('https://api.retellai.com/get-retell-llm/'+encodeURIComponent(agent.response_engine.llm_id),headers);const names=['get_business_information','find_upcoming_appointments','check_appointment_availability','book_appointment','reschedule_appointment','cancel_appointment'];out.managedToolsCorrect=names.filter(n=>(llm.general_tools||[]).some(t=>t.name===n&&t.url===canonical+'/api/automation/retell/functions')).length;}
              }catch(x){out.retellError=x.message.startsWith('HTTP_')?x.message:x.name;}
              if(u.twilioPhoneNumberSid&&e.TWILIO_ACCOUNT_SID&&e.TWILIO_AUTH_TOKEN){try{const p=await get('https://api.twilio.com/2010-04-01/Accounts/'+e.TWILIO_ACCOUNT_SID+'/IncomingPhoneNumbers/'+u.twilioPhoneNumberSid+'.json',{Authorization:'Basic '+Buffer.from(e.TWILIO_ACCOUNT_SID+':'+e.TWILIO_AUTH_TOKEN).toString('base64')});out.twilioHasTrunk=!!p.trunk_sid;out.twilioVoiceEnabled=!!p.capabilities?.voice;}catch(x){out.twilioError=x.message.startsWith('HTTP_')?x.message:x.name}}
              console.log('PROVIDER',JSON.stringify(out));
             }
             for(const route of ['inbound','functions','events']){const r=await fetch('http://127.0.0.1:'+e.PORT+'/api/automation/retell/'+route,{method:'POST',headers:{'content-type':'application/json','x-retell-signature':'invalid'},body:'{}'});console.log('SIGNATURE_GATE',route,r.status)}
            })().catch(x=>{console.log('AUDIT_ERROR',x.name);process.exitCode=1}).finally(()=>sequelize.close());
            NODE

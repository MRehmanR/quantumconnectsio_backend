name: Password reset diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /var/www/backend/quantumconnectsio_backend
            git log -1 --oneline
            git status --short
            node - <<'NODE'
            const e = require('./src/config/env');
            console.log({frontend: e.FRONTEND_APP_URL, port: e.PORT, smtpHost: e.SMTP_HOST, smtpPort: e.SMTP_PORT, smtpConfigured: !!(e.SMTP_USER && e.SMTP_PASS && e.SMTP_FROM)});
            const t = require('nodemailer').createTransport({host:e.SMTP_HOST,port:e.SMTP_PORT,secure:e.SMTP_SECURE==='true',auth:{user:e.SMTP_USER,pass:e.SMTP_PASS},connectionTimeout:10000,greetingTimeout:10000,socketTimeout:10000});
            t.verify().then(()=>console.log('SMTP authentication OK')).catch(x=>console.log({smtpError:x.code,command:x.command})).finally(()=>t.close());
            const {sequelize}=require('./src/config/db');
            sequelize.getQueryInterface().describeTable('users').then(x=>console.log({resetTokenColumn:!!x.resetPasswordTokenHash,resetExpiryColumn:!!x.resetPasswordExpiresAt})).catch(x=>console.log({databaseError:x.name})).finally(()=>sequelize.close());
            NODE
            curl --fail --silent http://127.0.0.1:3000/api/health
            grep -rh 'server_name' /etc/nginx/sites-enabled/ || true

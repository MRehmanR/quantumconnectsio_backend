name: Password reset diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /var/www/backend/quantumconnectsio_backend
            node - <<'NODE'
            const e=require('./src/config/env');
            console.log('VOICE_BASE',e.RETELL_API_BASE_URL);
            require('./src/services/retell-voices.service').listVoices().then(async voices=>{
              console.log('VOICE_CATALOG',JSON.stringify({count:voices.length,previews:voices.filter(v=>v.previewUrl).length}));
              for(const voice of voices.filter(v=>v.previewUrl).slice(0,2)){
                const r=await fetch(voice.previewUrl,{method:'HEAD',signal:AbortSignal.timeout(10000)});
                console.log('VOICE_AUDIO',JSON.stringify({status:r.status,type:r.headers.get('content-type')}));
              }
            }).catch(e=>console.log('VOICE_ERROR',e.message));
            NODE
